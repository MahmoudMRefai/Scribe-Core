services:
  # ─── PostgreSQL Database ───────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: scribe_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: scribe
      POSTGRES_PASSWORD: scribe_secret_2026
      POSTGRES_DB: scribe_dev
    ports:
      - '5432:5432'
    volumes:
      - scribe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scribe -d scribe_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Test Database (isolated) ──────────────────────────────
  postgres_test:
    image: postgres:16-alpine
    container_name: scribe_db_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: scribe_test
      POSTGRES_PASSWORD: scribe_test_secret
      POSTGRES_DB: scribe_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scribe_test -d scribe_test']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  scribe_pgdata:
    driver: local
